# Lefthook configuration for Git hooks
# Install: Add lefthook to dev_dependencies in pubspec.yaml
# Setup: Run `lefthook install` after cloning the repo

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    
    analyze:
      glob: "*.dart"
      run: flutter analyze
    
    # Uncomment when you have tests
    # test:
    #   glob: "*.dart"
    #   run: flutter test

commit-msg:
  commands:
    conventional-commit:
      run: |
        # Validate commit message format: type(scope): description
        # Examples: feat(auth): add login screen, fix(ui): button alignment
        
        COMMIT_MSG_FILE=$1
        COMMIT_MSG=$(cat "$COMMIT_MSG_FILE")
        
        # Regex for conventional commits
        PATTERN="^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .{1,100}"
        
        if ! echo "$COMMIT_MSG" | grep -qE "$PATTERN"; then
          echo "❌ Invalid commit message format!"
          echo ""
          echo "Commit message must follow the format:"
          echo "  type(scope): description"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
          echo ""
          echo "Examples:"
          echo "  feat(breathalyzer): add OCR camera screen"
          echo "  fix(scoring): correct points deduction formula"
          echo "  docs(readme): update installation instructions"
          echo ""
          exit 1
        fi

pre-push:
  commands:
    tests:
      run: flutter test
      skip:
        - merge
        - rebase
