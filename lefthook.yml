# Lefthook configuration for Git hooks
# Setup: Run `lefthook install` after cloning the repo

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    
    analyze:
      glob: "*.dart"
      run: flutter analyze
    
    # Uncomment when you have tests
    # test:
    #   glob: "*.dart"
    #   run: flutter test

commit-msg:
  scripts:
    "validate-commit-msg.ps1":
      runner: powershell

pre-push:
  commands:
    tests:
      run: flutter test
      skip:
        - merge
        - rebase
