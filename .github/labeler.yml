# Auto-label PRs based on files changed
# Format for actions/labeler@v5

'feature: player-registration':
  - changed-files:
    - any-glob-to-any-file: 'lib/features/player_registration/**/*'

'feature: breathalyzer':
  - changed-files:
    - any-glob-to-any-file: 'lib/features/breathalyzer/**/*'

'feature: checkpoint':
  - changed-files:
    - any-glob-to-any-file: 'lib/features/checkpoint/**/*'

'feature: scoring':
  - changed-files:
    - any-glob-to-any-file: 'lib/features/scoring/**/*'

'feature: leaderboard':
  - changed-files:
    - any-glob-to-any-file: 'lib/features/leaderboard/**/*'

'feature: achievements':
  - changed-files:
    - any-glob-to-any-file: 'lib/features/achievements/**/*'

'feature: fake-id':
  - changed-files:
    - any-glob-to-any-file: 'lib/features/fake_id/**/*'

'area: ui':
  - changed-files:
    - any-glob-to-any-file:
      - 'lib/widgets/**/*'
      - 'lib/core/theme/**/*'

'area: core':
  - changed-files:
    - any-glob-to-any-file: 'lib/core/**/*'

'area: tests':
  - changed-files:
    - any-glob-to-any-file: 'test/**/*'

'area: docs':
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - '.github/**/*'

'area: ci/cd':
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**/*'
      - 'lefthook.yml'

'area: dependencies':
  - changed-files:
    - any-glob-to-any-file:
      - 'pubspec.yaml'
      - 'pubspec.lock'

'area: android':
  - changed-files:
    - any-glob-to-any-file: 'android/**/*'

'area: ios':
  - changed-files:
    - any-glob-to-any-file: 'ios/**/*'
