name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

jobs:
  check-changelog:
    name: Check Changelog Updated
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if CHANGELOG.md was updated
        id: changelog
        run: |
          # Skip check for docs-only PRs
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(\.github/|.*\.md$)' && \
             ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qvE '^(\.github/|.*\.md$)'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if CHANGELOG.md was modified
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "CHANGELOG.md"; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on PR if changelog not updated
        if: steps.changelog.outputs.skip != 'true' && steps.changelog.outputs.updated == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Changelog not updated**\n\nPlease update `CHANGELOG.md` under the `[Unreleased]` section with your changes.\n\nExample:\n```markdown\n## [Unreleased]\n\n### Added\n- Your new feature (#' + context.issue.number + ')\n```'
            })
      
      - name: Fail if changelog not updated
        if: steps.changelog.outputs.skip != 'true' && steps.changelog.outputs.updated == 'false'
        run: |
          echo "❌ CHANGELOG.md was not updated"
          echo "Please add your changes to CHANGELOG.md under [Unreleased]"
          exit 1
