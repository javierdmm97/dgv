name: dgv
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.3
  riverpod_annotation: ^2.3.5
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  
  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # OCR
  google_mlkit_text_recognition: ^0.14.0
  camera: ^0.11.0+2
  
  # UI
  fl_chart: ^0.70.1
  image_picker: ^1.1.2
  image_gallery_saver: ^2.0.3
  
  # Audio
  audioplayers: ^6.1.0
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  
  # Linting
  flutter_lints: ^6.0.0
  
  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/license/
    - assets/environmentalDistinctives/
    - assets/titles/
    - assets/plantillas_app_dgt/
